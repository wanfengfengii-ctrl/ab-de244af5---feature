server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 健康检查
    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # 静态资源禁缓存，保证多标签页拿到一致的最新代码
    location ~* \.(?:js|css|json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
